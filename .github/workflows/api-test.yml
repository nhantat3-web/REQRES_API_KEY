name: API Testing - ReqRes

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API tests
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          test -n "$REQRES_API_KEY" || (echo "Missing REQRES_API_KEY secret" && exit 1)

          newman run Lab05_ReqRes/ReqRes_Collection.json \
            -e Lab05_ReqRes/ReqRes_Environment.json \
            -d Lab05_ReqRes/users.csv \
            --env-var "api-key=$REQRES_API_KEY" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export Lab05_ReqRes/report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReqRes-Test-Report
          path: Lab05_ReqRes/report.html
          if-no-files-found: warn
